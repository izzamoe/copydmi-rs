[package]
name = "copydmi"
version = "0.4.0"
edition = "2021"
description = "Rust CLI for Lenovo BIOS DMI/SMBIOS transplant, LENV decode, clean-image preparation, and SPI flash verification"
license = "MIT"
repository = "https://github.com/izzamoe/copydmi-rs"
authors = ["izzamoe"]
keywords = ["bios", "dmi", "lenovo", "insydeh2o", "flashrom"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "copydmi"
path = "src/main.rs"

[dependencies]
inno = { version = "0.5", features = ["extract"] }

[profile.release]
opt-level = 3
